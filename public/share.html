<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GCS Share | QR Pairing</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #0b1020;
            color: #eef2ff;
            font-family: Arial, sans-serif;
        }

        main {
            width: min(100%, 480px);
            padding: 36px;
            text-align: center;
            background: #11182b;
            border: 1px solid #293451;
            border-radius: 20px;
        }

        h1 {
            margin-top: 0;
            font-size: 2rem;
        }

        p {
            color: #aab4ca;
            line-height: 1.6;
        }

        #qr-container {
            min-height: 240px;
            display: grid;
            place-items: center;
            margin: 24px 0;
            padding: 16px;
            background: white;
            border-radius: 12px;
        }

        #qr {
            display: none;
            width: 220px;
            height: 220px;
        }

        button {
            padding: 14px 24px;
            border: none;
            border-radius: 999px;
            background: #a5b4fc;
            color: #0b1020;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
        }

        button:hover {
            background: #c7d2fe;
        }

        button:disabled {
            opacity: 0.5;
            font-size: 0.9rem;
        }

        a {
            display: inline-block;
            margin-top: 24px;
            color: #a5b4fc;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <main>
        <h1>Pair a device</h1>

        <p>
            Scan this QR code with the device you want to connect to GCS Share.
        </p>

        <div id="qr-container">
            <span id="placeholder">Your QR code will appear here</span>
            <img id="qr" alt="GCS Share Pairing QR Code">
        </div>

        <button id="generate" type="button">Generate QR Code</button>

        <p id="status" aria-live="polite">Waiting to generate a code...</p>

        <a href="/">Back to home</a>
    </main>

    <script>
        const button = document.getElementById("generate");
        const qr = document.getElementById("qr");
        const status = document.getElementById("status");
        const placeholder = document.getElementById("placeholder");

        button.addEventListener("click", async () => {
            button.disabled = true;
            status.textContent = "Generating QR code...";

            try {
                const response = await fetch("/api/pairing/qr", {
                    method: "POST"
                });

                const data = await response.json();

                if (!response.ok || !data.success) {
                    throw new Error(data.message || "QR generation failed");
                }

                qr.src = data.qrCode;
                qr.style.display = "block";
                placeholder.style.display = "none";

                status.textContent = "QR code generated! Scan to pair.";
            } catch (error) {
                const message = error instanceof Error ? error.message : "An unexpected error occurred.";
                status.textContent = `Error: ${message}`;
            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
