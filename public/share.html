<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GCS Share | QR Pairing</title>

    <style>
        :root {
            color-scheme: dark;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
            background: #0b1020;
            color: #eef2ff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                radial-gradient(ellipse at 20% 15%, #23315b 0, transparent 38%),
                radial-gradient(ellipse at 85% 85%, #20204a 0, transparent 34%),
                #0b1020;
        }

        main {
            width: min(100%, 720px);
            padding: clamp(32px, 7vw, 64px);
            border: 1px solid rgb(255 255 255 / 10%);
            border-radius: 24px;
            background: rgb(17 24 43 / 78%);
            box-shadow: 0 24px 80px rgb(0 0 0 / 35%);
            backdrop-filter: blur(12px);
        }

        h1 {
            margin: 0 0 16px;
            font-size: clamp(2.4rem, 7vw, 4rem);
            line-height: 1.05;
            letter-spacing: -0.06em;
            background: linear-gradient(100deg, #fff 20%, #a5b4fc 75%, #67e8f9);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        p {
            max-width: 55ch;
            margin: 0 0 12px;
            color: #aab4ca;
            font-size: 1rem;
            line-height: 1.8;
        }

        hr {
            border: none;
            border-top: 1px solid rgb(255 255 255 / 10%);
            margin: 24px 0;
        }

        .cta {
            display: inline-block;
            margin-top: 16px;
            padding: 14px 22px;
            border-radius: 999px;
            background: #fff;
            color: #0b1020;
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>

<body>
    <main>
        <h1>Pair a device</h1>

        <p>
            Scan this QR code with the device you want to connect to GCS Share.
        </p>

        <div id="qr-container">
        <span id="placeholder">Your QR code will appear here</span>
        <img id="qr" alt="">
        </div>

        <button id="generate" type="button">Generate QR Code</button>

        <p id="status" aria-live="polite"></p>

        <a href="receive.html">Receive files.</a>
        <a href="/">Back to home.</a>
    </main>

    <script>
        const button = document.getElementById("generate");
        const qr = document.getElementById("qr");
        const status = document.getElementById("status");
        const placeholder = document.getElementById("placeholder");

        button.addEventListener("click", async () => {
            button.disabled = true;
            status.textContent = "Generating QR code...";

            try {
                const response = await fetch("/api/pairing/qr", {
                    method: "POST"
                });

                const data = await response.json();

                if (!response.ok || !data.success) {
                    throw new Error(data.message || "QR generation failed");
                }

                sessionStorage.setItem("gcsDeviceId", data.deviceId);
                sessionStorage.setItem("gcsSessionToken", data.sessionToken);

                qr.src = data.qrCode;
                qr.style.display = "block";
                placeholder.style.display = "none";

                status.textContent = "QR code generated! Scan to pair.";
            } catch (error) {
                const message = error instanceof Error ? error.message : "An unexpected error occurred.";
                status.textContent = `Error: ${message}`;
            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
