<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GCS Share | Send & Receive</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Arial, sans-serif;
            background: #0b1020;
            color: #eef2ff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                radial-gradient(ellipse at 20% 15%, #23315b 0, transparent 38%),
                radial-gradient(ellipse at 85% 85%, #20204a 0, transparent 34%),
                #0b1020;
        }

        main {
            width: min(100%, 720px);
            padding: clamp(32px, 7vw, 64px);
            border: 1px solid rgb(255 255 255 / 10%);
            border-radius: 24px;
            background: rgb(17 24 43 / 78%);
            box-shadow: 0 24px 80px rgb(0 0 0 / 35%);
            backdrop-filter: blur(12px);
            text-align: center;
        }

        h1 {
            margin: 0 0 8px;
            font-size: clamp(2.4rem, 7vw, 4rem);
            line-height: 1.05;
            letter-spacing: -0.06em;
            background: linear-gradient(100deg, #fff 20%, #a5b4fc 75%, #67e8f9);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        p {
            max-width: 55ch;
            margin: 0 auto 12px;
            color: #aab4ca;
            font-size: 1rem;
            line-height: 1.8;
        }

        hr {
            border: none;
            border-top: 1px solid rgb(255 255 255 / 10%);
            margin: 24px 0;
        }

        .avatar {
            width: 72px;
            height: 72px;
            margin: 0 auto 16px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #a5b4fc, #67e8f9);
            color: #0b1020;
        }

        .sender-name {
            color: #fff;
            font-size: 1.25rem;
            font-weight: 700;
            margin: 0;
        }

        .sender-sub {
            color: #aab4ca;
            margin-top: 4px;
        }

        .file-preview {
            text-align: left;
            padding: 14px 16px;
            margin-top: 12px;
            border: 1px solid rgb(255 255 255 / 10%);
            border-radius: 12px;
            background: rgb(255 255 255 / 4%);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .file-preview span {
            color: #eef2ff;
        }

        .file-preview small {
            color: #aab4ca;
            display: block;
        }

        .btn-row {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 24px;
        }

        .cta {
            padding: 14px 28px;
            border-radius: 999px;
            background: #fff;
            color: #0b1020;
            font-weight: 700;
            border: none;
            cursor: pointer;
            font-family: inherit;
        }

        .decline {
            padding: 14px 28px;
            border-radius: 999px;
            background: transparent;
            color: #fda4af;
            border: 1px solid rgb(255 255 255 / 20%);
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
        }

        .send-row {
            margin: 24px 0;
        }

        .send-row button {
            font-family: inherit;
            font-size: 1rem;
        }

        #timer {
            color: #fda4af;
            font-weight: 700;
        }

        #status {
            margin-top: 16px;
            color: #67e8f9;
            min-height: 24px;
        }

        #senderAvatar,
        #senderName,
        #senderSub,
        #files-list,
        .btn-row {
            display: none;
        }

        .qr-panel {
            padding: 24px;
            border: 1px solid rgb(255 255 255 / 10%);
            border-radius: 18px;
            background: rgb(255 255 255 / 4%);
            margin-bottom: 24px;
        }

        .qr-icon {
            font-size: 3rem;
            color: #a5b4fc;
            margin-bottom: 12px;
        }

        .qr-panel h2 {
            margin: 0 0 8px;
            color: #fff;
        }

        .qr-panel p {
            font-size: 0.9rem;
        }

        #qr-reader {
            width: 100%;
            min-height: 260px;
            max-width: 400px;
            margin: 20px auto;
            overflow: hidden;
            display: grid;
            place-items: center;
            border-radius: 12px;
            border: 1px solid rgb(255 255 255 / 12%);
            background: rgb(0 0 0 / 25%);
        }

        #qr-reader:empty::before {
            content: "Camera preview will appear here";
            color: #aab4ca;
            font-size: 0.9rem;
        }

        #scannerStatus {
            margin-top: 12px;
            min-height: 20px;
            font-size: 0.85rem;
        }

        #qr-reader video {
            display: block;
            width: 100% !important;
            min-height: 260px;
            object-fit: cover;
            border-radius: 12px;
        }

        #scanner-panel {
            padding: 24px;
            border: 1px solid rgb(255 255 255 / 10%);
            border-radius: 16px;
            background: rgb(255 255 255 / 3%);
        }

        #scanner-panel h2 {
            margin: 0 0 8px;
            color: #fff;
            font-size: 1.4rem;
        }

        #startScannerBtn {
            margin-top: 8px;
        }

        #scanner-panel button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <main>
        <div id="scanner-panel">
            <h2>Connect a device</h2>
            <p>Scan a GCS Share QR code to connect to another device.</p>

            <div id="qr-reader"></div>

            <button class="cta" id="startScannerBtn">Open camera</button>
            <p id="scannerStatus">Your camera will be requested when you start scanning.</p>
        </div>

        <div class="avatar" id="senderAvatar">?</div>
        <p class="sender-name" id="senderName">Incoming Transfer</p>
        <p class="sender-sub" id="senderSub">Wants to send you files • Expires in <span id="timer">2:00</span></p>

        <hr>

        <div class="send-row">
            <input type="file" id="fileInput" hidden>
            <button class="cta" id="sendBtn">Send Files</button>
        </div>

        <!-- Incoming transfers -->

        <div id="files-list">
            <p>Waiting for sender...</p>
        </div>

        <div class="btn-row">
            <button class="decline" id="declineBtn">Decline</button>
            <button class="cta" id="acceptBtn">Accept</button>
        </div>

        <p id="status"></p>
    </main>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<script>
    let expiresAt = null;

    setInterval(() => {
        if (!expiresAt) {
            updateActionButtons();
            return;
        }

        const seconds = Math.max(0, Math.ceil((expiresAt - Date.now()) / 1000));
        const m = Math.floor(seconds / 60);
        const s = String(seconds % 60).padStart(2, '0');

        const timer = document.getElementById('timer');
        if (timer) {
            timer.textContent = seconds === 0 ? 'Expired' : m + ':' + s;
        }

        updateActionButtons();
    }, 250);

    // ==============================
    // BACKEND PLACEHOLDER
    // ==============================
    // TODO FOR BACKEND:
    // 1. When sender connects, get sender name + file list + hash
    // 2. Call showIncomingTransfer(senderName, files) below
    // 3. On Accept -> start download for THAT hash only, then call showFiles()
    // 4. On Decline -> cancel session / delete uploads for THAT hash

    const filesList = document.getElementById('files-list');
    const status = document.getElementById('status');
    const acceptBtn = document.getElementById('acceptBtn');
    const declineBtn = document.getElementById('declineBtn');

    const scannerPanel = document.getElementById('scanner-panel');
    const scannerStatus = document.getElementById('scannerStatus');
    const startScannerBtn = document.getElementById('startScannerBtn');

    let qrScanner = null;
    let qrHandled = false;

    if (!window.isSecureContext) {
        startScannerBtn.disabled = true;
        scannerStatus.textContent =
            'Camera access requires HTTPS, or use localhost on this device.';
    } else if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        startScannerBtn.disabled = true;
        scannerStatus.textContent = 'This browser does not support camera access.';
    }

    startScannerBtn.addEventListener('click', async () => {
        if (typeof Html5Qrcode === 'undefined') {
            scannerStatus.textContent = 'The QR scanner could not load. Check your internet connection and reload.';
            return;
        }

        startScannerBtn.disabled = true;
        scannerStatus.textContent = 'Requesting camera access...';

        try {
            qrScanner = new Html5Qrcode('qr-reader');
            const cameras = await Html5Qrcode.getCameras();

            if (cameras.length === 0) {
                throw new Error('No camera was found on this device.');
            }

            const camera =
                cameras.find(({ label }) => /back|rear|environment/i.test(label)) ||
                cameras[0];

            await qrScanner.start(
                camera.id,
                {
                    fps: 10,
                    qrbox: (viewfinderWidth, viewfinderHeight) => {
                        const size = Math.min(240, viewfinderWidth, viewfinderHeight);
                        return { width: size, height: size };
                    }
                },
                async (decodedText) => {
                    if (qrHandled) return;

                    let scannedURL;

                    try {
                        scannedURL = new URL(decodedText);

                        if (!['http:', 'https:'].includes(scannedURL.protocol)) {
                            throw new Error('Invalid protocol');
                        }
                    } catch {
                        scannerStatus.textContent = 'That QR code does not contain a valid web link.';
                        return;
                    }

                    qrHandled = true;
                    scannerStatus.textContent = 'QR code found! Connecting...';

                    try {
                        await qrScanner.stop();
                    } catch (error) {
                        console.warn('Could not stop scanner:', error);
                    }

                    window.location.href = scannedURL.href;
                },
                () => {}
            );

            startScannerBtn.textContent = 'Camera active';
            scannerStatus.textContent = 'Point your camera at a GCS Share QR code.';
        } catch (error) {
            scannerStatus.textContent =
                'Could not start camera: ' + (error.message || String(error));
            startScannerBtn.disabled = false;
        }
    });

    let deviceId = sessionStorage.getItem('gcsDeviceId');
    let sessionToken = sessionStorage.getItem('gcsSessionToken');
    let currentTransfer = null;
    let actionInProgress = false;

    function authHeaders() {
        return {
            'x-device-id': deviceId,
            'x-session-token': sessionToken
        };
    }

    const fileInput = document.getElementById('fileInput');
    const sendBtn = document.getElementById('sendBtn');

    sendBtn.addEventListener('click', () => {
        if (!deviceId || !sessionToken) {
            status.textContent = 'Please pair your device first.';
            return;
        }

        fileInput.click();
    });

    fileInput.addEventListener('change', async () => {
        const file = fileInput.files[0];

        if (!file) return;

        const MAX_FILE_SIZE = 50 * 1024 * 1024;

        if (file.size > MAX_FILE_SIZE) {
            status.textContent = 'File too large! Maximum file size is 50 MB.';
            fileInput.value = '';
            return;
        }

        sendBtn.disabled = true;
        status.textContent = `Uploading ${file.name}...`;

        try {
            const urlResponse = await fetch('/api/upload-url', {
                method: 'POST',
                headers: {
                    ...authHeaders(),
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    filename: file.name,
                    contentType: file.type,
                    fileSize: file.size
                })
            });

            const urlData = await urlResponse.json();

            if (!urlResponse.ok || !urlData.success) {
                throw new Error(urlData.message || 'Could not prepare upload');
            }

            const uploadResponse = await fetch(urlData.uploadUrl, {
                method: 'PUT',
                headers: {
                    'Content-Type': file.type || 'application/octet-stream'
                },
                body: file
            });

            if (!uploadResponse.ok) {
                throw new Error('Filebase upload failed');
            }

            const completeResponse = await fetch('/api/upload-complete', {
                method: 'POST',
                headers: {
                    ...authHeaders(),
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    fileId: urlData.fileId
                })
            });

            const completeData = await completeResponse.json();

            if (!completeResponse.ok || !completeData.success) {
                throw new Error(completeData.message || 'Upload completion failed');
            }

            status.textContent = `Successfully sent ${completeData.file.originalName || file.name}!`;
        } catch (error) {
            status.textContent = `Upload failed: ${error.message}`;
        } finally {
            sendBtn.disabled = false;
            fileInput.value = '';
        }
    });

    function updateActionButtons() {
        const unavailable = !currentTransfer || !expiresAt || expiresAt - Date.now() <= 0;
        acceptBtn.disabled = actionInProgress || unavailable;
        declineBtn.disabled = actionInProgress || unavailable;
    }

    async function connectFromQR() {
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');

        if (!token) return true;

        status.textContent = 'Connecting to paired device...';

        try {
            const response = await fetch('/api/pairing/verify', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ token })
            });

            const data = await response.json();

            if (!response.ok || !data.success) {
                throw new Error(data.message || 'Pairing failed.');
            }

            deviceId = data.deviceId;
            sessionToken = data.sessionToken;

            sessionStorage.setItem('gcsDeviceId', deviceId);
            sessionStorage.setItem('gcsSessionToken', sessionToken);

            history.replaceState({}, document.title, '/receive.html');

            scannerPanel.style.display = 'none';
            status.textContent = 'Successfully connected!';
            return true;
        } catch (error) {
            status.textContent = 'Connection failed: ' + error.message;
            return false;
        }
    }

    updateActionButtons();

    document.getElementById('acceptBtn').addEventListener('click', async () => {
        if (!currentTransfer || actionInProgress) return;

        actionInProgress = true;
        acceptBtn.disabled = true;
        declineBtn.disabled = true;

        try {
            const id = encodeURIComponent(currentTransfer.id);

            const response = await fetch(`/api/transfers/${id}/accept`, {
                method: 'POST',
                headers: authHeaders()
            });

            const data = await response.json();

            if (!response.ok || !data.success) {
                throw new Error(data.message || 'Could not accept transfer.');
            }

            status.textContent = 'Downloading...';

            const fileId = encodeURIComponent(data.file.id);
            const downloadResponse = await fetch(`/api/files/${fileId}`, {
                headers: authHeaders()
            });

            console.log('Download response:', downloadResponse.status);

            if (!downloadResponse.ok) {
                throw new Error('Download failed.');
            }

            const blob = await downloadResponse.blob();
            const url = URL.createObjectURL(blob);

            const link = document.createElement('a');
            link.href = url;
            link.download = data.file.name;
            document.body.appendChild(link);
            link.click();
            link.remove();

            setTimeout(() => URL.revokeObjectURL(url), 1000);

            const completionResponse = await fetch(`/api/transfers/${id}/complete`, {
                method: 'POST',
                headers: authHeaders()
            });
            const completionData = await completionResponse.json();
            console.log('Completion response', completionResponse.status, completionData);

            if (!completionResponse.ok || !completionData.success) {
                console.error('Transfer completion failed:', completionData);
                status.textContent = 'File downloaded, but transfer cleanup failed.';
            } else {
                status.textContent = 'File downloaded successfully!';
            }

            filesList.textContent = 'Transfer complete.';
            currentTransfer = null;
        } catch (error) {
            status.textContent = error.message;
        } finally {
            actionInProgress = false;
            updateActionButtons();
        }
    });

    document.getElementById('declineBtn').addEventListener('click', async () => {
        if (!currentTransfer || actionInProgress) return;

        actionInProgress = true;
        acceptBtn.disabled = true;
        declineBtn.disabled = true;

        try {
            const id = encodeURIComponent(currentTransfer.id);

            const response = await fetch(`/api/transfers/${id}/decline`, {
                method: 'POST',
                headers: authHeaders()
            });

            const data = await response.json();

            if (!response.ok || !data.success) {
                throw new Error(data.message || 'Could not decline transfer');
            }

            currentTransfer = null;
            filesList.textContent = 'Transfer declined.';
            status.textContent = 'The file has been discarded.';
        } catch (error) {
            status.textContent = error.message;
        } finally {
            actionInProgress = false;
            updateActionButtons();
        }
    });

    // FRONTEND - Backend calls this when sender connects
    // senderName = "Alex" , files = [{ name, size }]
    function showIncomingTransfer(transfer) {
        currentTransfer = transfer;

        document.getElementById('senderAvatar').style.display = 'grid';
        document.getElementById('senderName').style.display = 'block';
        document.getElementById('senderSub').style.display = 'block';
        filesList.style.display = 'block';

        const name = transfer.senderName || 'Connected device';

        document.getElementById('senderName').textContent =
            name + ' wants to send you';

        document.getElementById('senderAvatar').textContent =
            name.charAt(0).toUpperCase();

        document.getElementById('senderSub').textContent =
            '1 file * Expires in ';

        const timer = document.createElement('span');
        timer.id = 'timer';
        timer.textContent = '2:00';
        document.getElementById('senderSub').appendChild(timer);

        filesList.replaceChildren();

        const preview = document.createElement('div');
        preview.className = 'file-preview';

        const details = document.createElement('div');

        const filename = document.createElement('span');
        filename.textContent = transfer.file.name;

        const size = document.createElement('small');
        size.textContent = formatSize(transfer.file.size);

        details.append(filename, size);

        const icon = document.createElement('span');
        icon.textContent = '📄';

        preview.append(details, icon);
        filesList.appendChild(preview);

        document.querySelector('.btn-row').style.display = 'flex';

        expiresAt = transfer.expiresAt;
        updateActionButtons();
    }

    function formatSize(bytes) {
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
        return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    async function checkForTransfers() {
        if (!deviceId || !sessionToken || actionInProgress) return;

        try {
            const response = await fetch('/api/transfers/pending', {
                headers: authHeaders()
            });

            const data = await response.json();

            if (!response.ok || !data.success) {
                throw new Error(data.message || 'Could not check transfers.');
            }

            if (!data.transfer) {
                return;
            }

            if (currentTransfer && currentTransfer.id === data.transfer.id) {
                return;
            }

            showIncomingTransfer(data.transfer);
        } catch (error) {
            status.textContent = error.message;
        }
    }

    async function initialise() {
        const connected = await connectFromQR();

        if (!connected) return;

        if (deviceId && sessionToken) {
            scannerPanel.style.display = 'none';
            status.textContent = 'Connected. Ready to share files.';
            checkForTransfers();
            setInterval(checkForTransfers, 1500);
        } else {
            status.textContent = 'Please generate a QR code on another device and scan it.';
        }
    }

    initialise();

    // FRONTEND - Backend calls this after Accept, when files are ready to download
    // files = [{ name, size, url }]
    function showFiles(files) {
        filesList.innerHTML = files.map(f => `
            <div class="file-preview">
                <div><span>${f.name}</span><small>${f.size}</small></div>
                <a href="${f.url}" style="color:#67e8f9; font-weight:700; text-decoration:none;">Download ↓</a>
            </div>
        `).join('');
        status.textContent = 'Ready to download.';
    }

    // PLACEHOLDER DEMO - remove when backend connected
    // showIncomingTransfer("Alex", [
    //   { name: "photo.jpg", size: "2.4 MB" },
    //   { name: "notes.pdf", size: "1.1 MB" }
    // ]);
</script>
</body>
</html>
