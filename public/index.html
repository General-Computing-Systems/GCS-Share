<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GCS Share</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Arial, sans-serif;
            background: #0b1020;
            color: #eef2ff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                radial-gradient(ellipse at 20% 15%, #23315b 0, transparent 38%),
                radial-gradient(ellipse at 85% 85%, #20204a 0, transparent 34%),
                #0b1020;
        }

        main {
            width: min(100%, 720px);
            padding: clamp(32px, 7vw, 64px);
            border: 1px solid rgb(255 255 255 / 10%);
            border-radius: 24px;
            background: rgb(17 24 43 / 78%);
            box-shadow: 0 24px 80px rgb(0 0 0 / 35%);
            backdrop-filter: blur(12px);
        }

        h1 {
            margin: 0 0 16px;
            font-size: clamp(2.4rem, 7vw, 4rem);
            line-height: 1.05;
            letter-spacing: -0.06em;
            background: linear-gradient(100deg, #fff 20%, #a5b4fc 75%, #67e8f9);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        p {
            max-width: 55ch;
            margin: 0 0 12px;
            color: #aab4ca;
            font-size: 1rem;
            line-height: 1.8;
        }

        hr {
            border: none;
            border-top: 1px solid rgb(255 255 255 / 10%);
            margin: 24px 0;
        }

        .cta {
            display: inline-block;
            margin-top: 16px;
            padding: 14px 22px;
            border-radius: 999px;
            background: #fff;
            color: #0b1020;
            text-decoration: none;
            font-weight: 700;
        }

        .options {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
            margin-top: 24px;
            width: 100%;
        }

        .option {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 14px;
            min-width: 14px;
            padding: 28px;
            border: 1px solid rgb(255 255 255 / 10%);
            border-radius: 18px;
            background: rgb(255 255 255 / 4%);
            color: #eef2ff;
            text-decoration: none;
            overflow: hidden;
            transition: 0.2s ease;
        }

        .option:hover {
            background: rgb(255 255 255 / 9%);
            border-color: #818cf8;
            transform: translateY(-3px);
        }

        .option-icon {
            display: block;
            line-height: 1;
            font-size: 2rem;
            color: #a5b4fc;
        }

        .option strong {
            font-size: 1.1rem;
        }

        .option span:last-child {
            color: #aab4ca;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        @media (max-width: 550px) {
            .options {
                grid-template-columns: minmax(0, 1fr);
            }
        }
    </style>
</head>
<body>
    <main>
        <h1>GCS Share</h1>
        <p>Local file sharing, simplified.</p>
        <p id="status">Connecting...</p>
        <hr>
        
        <p>Choose how you'd like to connect:</p>

        <div class="options">
            <a class="option" href="/share.html">
                <span class="option-icon">▦</span>
                <strong>Generate a code</strong>
                <span>Create a QR code for another device to scan.</span>
            </a>

            <a class="option" href="/receive.html">
                <span class="option-icon">⌗</span>
                <strong>Receive a code</strong>
                <span>Already have a QR code? Scan it with you camera.</span>
            </a>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
