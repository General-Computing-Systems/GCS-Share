<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GCS Share</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
            background: #0b1020;
            color: #eef2ff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                radial-gradient(ellipse at 20% 15%, #23315b 0, transparent 38%),
                radial-gradient(ellipse at 85% 85%, #20204a 0, transparent 34%),
                #0b1020;
        }

        main {
            width: min(100%, 720px);
            padding: clamp(32px, 7vw, 64px);
            border: 1px solid rgb(255 255 255 / 10%);
            border-radius: 24px;
            background: rgb(17 24 43 / 78%);
            box-shadow: 0 24px 80px rgb(0 0 0 / 35%);
            backdrop-filter: blur(12px);
        }

        h1 {
            margin: 0 0 16px;
            font-size: clamp(2.4rem, 7vw, 4rem);
            line-height: 1.05;
            letter-spacing: -0.06em;
            background: linear-gradient(100deg, #fff 20%, #a5b4fc 75%, #67e8f9);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        p {
            max-width: 55ch;
            margin: 0 0 12px;
            color: #aab4ca;
            font-size: 1rem;
            line-height: 1.8;
        }

        hr {
            border: none;
            border-top: 1px solid rgb(255 255 255 / 10%);
            margin: 24px 0;
        }

        .cta {
            display: inline-block;
            margin-top: 16px;
            padding: 14px 22px;
            border-radius: 999px;
            background: #fff;
            color: #0b1020;
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <main>
        <h1>GCS Share</h1>
        <p>Local file sharing, simplified.</p>
        <p id="status">Connecting...</p>
        <hr>
        <p>GCS Share is an easy-to-use alternative to other file sharing tools.</p>
        <p>It offers a simple way to transfer files using a QR code system.</p>
        <a class="cta" href="/share.html">Open QR Share →</a>
    </main>

    <script src="app.js"></script>
</body>
</html>
